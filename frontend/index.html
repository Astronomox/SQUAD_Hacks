  <style>
    html, body, #root { height: 100%; }
    body { font-family: 'DM Sans', system-ui, sans-serif; color: #111111; background: #F4F4F2; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    h1,h2,h3,h4,.font-display { font-family: 'Sora', sans-serif; letter-spacing: -0.02em; }
    .font-mono,code,kbd { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #d6d6d6; border-radius: 8px; border: 2px solid #F4F4F2; }
    ::-webkit-scrollbar-thumb:hover { background: #bdbdbd; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #333; border-color: #1A1A1A; }
    .splash { position: fixed; inset: 0; display: grid; place-items: center; background: #111; z-index: 50; }
    .splash-logo { animation: splashPulse 1.4s ease-in-out infinite; }
    @keyframes splashPulse { 0%,100% { opacity:1; transform:scale(1) } 50% { opacity:.7; transform:scale(1.08) } }
    @keyframes shimmer { 0% { background-position: -200px 0 } 100% { background-position: 200px 0 } }
    .shimmer { background: linear-gradient(90deg, transparent, rgba(232,80,26,.18), transparent); background-size: 200px 100%; animation: shimmer 1.2s linear infinite; }
    @keyframes scanRing { 0% { transform: rotate(0deg) } 100% { transform: rotate(360deg) } }
    .scan-ring { background: conic-gradient(from 0deg, transparent 0deg, transparent 270deg, #E8501A 360deg); animation: scanRing 1.6s linear infinite; }
    @keyframes sweep { 0% { top: 8%; opacity: 0 } 10% { opacity: 1 } 90% { opacity: 1 } 100% { top: 92%; opacity: 0 } }
    .sweep-bar { animation: sweep 2.2s ease-in-out infinite; }
    @keyframes ping-soft { 0% { transform: scale(1); opacity: .7 } 80%,100% { transform: scale(2.2); opacity: 0 } }
    .live-dot { position: relative; }
    .live-dot::after { content: ''; position: absolute; inset: 0; border-radius: 999px; background: currentColor; animation: ping-soft 1.6s cubic-bezier(0,0,.2,1) infinite; }
    .focus-ring:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(232,80,26,.22); }
    .recharts-default-tooltip { border-radius: 10px !important; border: 1px solid #E4E4E0 !important; box-shadow: 0 4px 16px rgba(0,0,0,.10) !important; }
